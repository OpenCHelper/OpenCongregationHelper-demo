name: Deploy the demo

# Deploys the latest release of OpenCongregationHelper (pre-releases included) to the demo
# site, with fresh dummy data:
# - every 6 hours, when a new release has been published since the last deployment;
# - every night, to reset the data changed by the visitors;
# - manually, to deploy the latest release again.
#
# The deployed releases are recorded as `deployed/<tag>` tags of this repository.
#
# Altervista has no cron: every deployment creates (or updates) the cron-job.org job of the `(Demo)` folder, which calls
# the scheduler of the demo with a new token, also written in its `.env` file.
on:
  schedule:
    - cron: "41 */6 * * *" # New releases
    - cron: "23 2 * * *" # Nightly reset
  workflow_dispatch: # Manually trigger a workflow run

permissions:
  contents: read

# One deployment at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: OpenCHelper/OpenCongregationHelper

jobs:
  check:
    name: Find the release to deploy
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      deploy: ${{ steps.release.outputs.deploy }}

    steps:
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RESET: ${{ github.event.schedule == '23 2 * * *' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Releases are listed newest first: the first one that is not a draft
          tag=$(gh api "repos/$UPSTREAM_REPOSITORY/releases" --jq '[.[] | select(.draft | not)][0].tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::error::No release of $UPSTREAM_REPOSITORY found"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$NIGHTLY_RESET" = "true" ]; then
            deploy=true
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/deployed/$tag" > /dev/null 2>&1; then
            deploy=false
          else
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "::notice::Latest release: $tag, deploying: $deploy"

  deploy:
    name: Deploy
    needs: check
    if: needs.check.outputs.deploy == 'true'
    uses: OpenCHelper/OpenCongregationHelper/.github/workflows/upload-altervista-reusable.yml@main
    with:
      repository: OpenCHelper/OpenCongregationHelper
      ref: ${{ needs.check.outputs.tag }}
      environment: DEMO
      label: DEMO
      reset-database: true
      seed-dummy-data: true
      setup-root-user: true
      install-dev-dependencies: false
      # Uploaded as a single archive into the `demo/` folder of the space (see the README)
      environment-folder: demo
      # The space also hosts the PR previews of OpenCongregationHelper: keep them in its router
      router-previews: true
      # Scheduler cron job on cron-job.org, with the CRON_JOB_ORG_API_KEY secret of the DEMO environment: every 5
      # minutes from 8:00 to 22:55 (Rome time) on weekdays, like the PR previews, whose scheduled tasks are all due then
      cron-folder: (Demo)
      # The `.env` file of the demo, written on every deployment with a new `APP_KEY` and `ARTISAN_CRON_TOKEN`, plus
      # the `ROOT_PASSWORD` secret of the DEMO environment as `INITIAL_ROOT_PASSWORD` (the database has no password)
      dotenv: |
        APP_NAME='OpenCongregationHelper'
        APP_ENV='demo'
        APP_DEBUG=false
        APP_URL='https://ochdemo.altervista.org'
        ASSET_URL='https://ochdemo.altervista.org'
        APP_LOCALE='en'
        APP_FALLBACK_LOCALE='en'
        
        APP_VERSION_BRANCH_FILE='.git-branch-name'
        APP_VERSION_COMMIT_FILE='.git-commit-hash'
        
        LOG_CHANNEL='single'
        LOG_LEVEL='warning'
        
        DB_CONNECTION='mysql'
        DB_HOST='localhost'
        DB_PORT=3306
        DB_DATABASE='my_ochdemo'
        DB_USERNAME='ochdemo'
        DB_PASSWORD=''
        DB_ENGINE='InnoDB'
        DB_PREFIX='demo_'
        
        SESSION_DRIVER='database'
        CACHE_STORE='database'
        QUEUE_CONNECTION='sync'
        
        MAIL_MAILER='log'
        MAIL_FROM_ADDRESS='ochdemo@altervista.org'
        MAIL_FROM_NAME='OpenCongregationHelper (Demo)'

        INITIAL_ROOT_USERNAME='Demo User'
        INITIAL_ROOT_USERMAIL='demo@example.com'
        DEMO_PREFILL_LOGIN_CREDENTIALS=true
    secrets: inherit

  record:
    name: Record the deployed release
    needs: [check, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Tag this repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/deployed/$TAG" > /dev/null 2>&1; then
            echo "deployed/$TAG already recorded"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/deployed/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
            echo "::notice::Recorded deployed/$TAG"
          fi
